# Off-box audit witness (card #196). Deploy: deploy/audit-witness/README.md.
name = "havn-audit"
main = "worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "WITNESS"
class_name = "BoxWitness"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoxWitness"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "havn-audit"

# Daily operator report (part 3), 11:00 UTC = 7:00 Toronto in summer, 6:00 in winter.
[triggers]
crons = ["0 11 * * *"]
