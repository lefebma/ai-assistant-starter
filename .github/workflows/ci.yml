name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class launch target; Linux is the fast-follow.
        # Bugs found here cost 10x less than bugs found at release.
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  install-smoke:
    name: install-smoke ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Bundle without the pinned runtime (system node stands in), install
      # into a temp dir, then prove the install: self-test + service dry-run.
      - run: node dist/scripts/build-installer.js --no-runtime
      - run: node dist-installer/staging/install.mjs --dir "${{ runner.temp }}/assistant-install"
      # The wizard is the one installer step --dry-run can never reach, because
      # it is interactive — and it is where both v1.14.1 (Claude CLI treated as
      # required) and v1.14.2 (npm build attempted on a prebuilt bundle) went
      # wrong, each found only by a human doing a real install. Feed it a canned
      # stdin: every free-text answer becomes "1", every numbered choice picks
      # option 1, every y/N reads as no. The feed has to stay open rather than
      # come from a file: readline drains a file before the later questions are
      # asked, hits EOF, closes the interface, and the wizard exits early at
      # question two. pipefail is off for that one line because the writer is
      # meant to die of SIGPIPE when the wizard finishes; the wizard's own exit
      # status is read back out of PIPESTATUS instead.
      - name: setup wizard walks to the end on a bundle
        shell: bash
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/assistant-install
        run: |
          set +o pipefail
          while :; do echo 1; done | node dist/scripts/setup.js > wizard.log 2>&1
          status=${PIPESTATUS[1]}
          cat wizard.log
          [ "$status" -eq 0 ]
          grep -q 'No build needed' wizard.log
          grep -q 'Setup complete' wizard.log
          rm -f wizard.log
      - run: node "${{ runner.temp }}/assistant-install/dist/src/index.js" --selftest
      - run: node "${{ runner.temp }}/assistant-install/dist/scripts/service.js" install --dry-run

  # Distributable bundles, with the pinned Node runtime inside. install-smoke
  # deliberately builds --no-runtime (fast, system node stands in), so it
  # proves the install path but produces nothing you can hand to a customer.
  # build-installer is host-only — nodeDistName() reads process.platform and
  # npm ci compiles native modules against the host — so each platform's
  # bundle has to be built on that platform. This is the only place that
  # happens, which makes CI the way to get a Windows bundle without owning a
  # Windows machine.
  #
  # macos-15-intel covers darwin-x64: macos-latest is Apple Silicon only, and
  # an Intel Mac handed an arm64 bundle fails in a way that looks like our bug
  # rather than the wrong download (Rosetta translates x64 to arm64, not the
  # reverse, so it cannot rescue this). macos-13 is not an option — it was
  # retired 2025-12-04 and the label simply never schedules. Note the Intel
  # runners themselves sunset in Fall 2027, so darwin-x64 has an expiry date.
  #
  # Not on pull_request: several minutes and a Node download per platform,
  # and the artifacts are only wanted for real distribution.
  bundles:
    name: bundle ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # APP_NAME names the setup launcher that ships inside the payload
      # ("Setup Havn.command"). Without it the artifacts say "AI Assistant",
      # which is the generic starter's name, not the product customers are
      # handed. Note this does not rename the tarball itself — that string is
      # hardcoded in build-installer and is a separate change.
      - run: node dist/scripts/build-installer.js
        env:
          APP_NAME: Havn
      # Prove the bundle actually runs before publishing it: a broken artifact
      # that nobody opened until a customer opened it is the failure mode this
      # whole job exists to avoid.
      # Paths stay relative to the workspace on purpose. RUNNER_TEMP on Windows
      # is a native path (D:\a\_temp) and GNU tar under Git Bash mangles the
      # drive letter and backslashes; node accepts them, which is why
      # install-smoke gets away with it and this step did not. Relative paths
      # are resolved against cwd by both tools on all three platforms.
      - name: installs and self-tests
        shell: bash
        run: |
          rm -rf _verify && mkdir -p _verify/unpack
          tar -xzf dist-installer/ai-assistant-v*.tar.gz -C _verify/unpack
          node _verify/unpack/install.mjs --dir _verify/install
          node _verify/install/dist/src/index.js --selftest
          rm -rf _verify
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: dist-installer/ai-assistant-v*.tar.gz
          retention-days: 30
          if-no-files-found: error
